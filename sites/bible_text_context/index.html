<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Text & Context</title>

  <!-- Google Font (clean, scholarly feel) -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: #f5f1e8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .wrap {
      max-width: 720px;
      padding: 50px 24px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 0.6px;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: #c8a96b;
      margin: 18px auto 24px auto;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #d6d1c4;
      margin: 10px 0;
    }

    .highlight {
      color: #c8a96b;
      font-weight: 400;
    }

    .instagram {
      margin-top: 32px;
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid #c8a96b;
      color: #c8a96b;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.6px;
      transition: all 0.2s ease;
    }

    .instagram:hover {
      background: #c8a96b;
      color: #0f0f0f;
    }

    .small {
      margin-top: 28px;
      font-size: 0.9rem;
      color: #a8a394;
      letter-spacing: 0.4px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Bible Text & Context</h1>

    <div class="divider"></div>

    <p>The Bible was written in a real world,</p>
    <p>to real people,</p>
    <p>in real moments of history.</p>

    <p class="highlight">If we miss the context, we miss the meaning.</p>

    <a
      class="instagram"
      href="https://instagram.com/bible_textandcontext"
      target="_blank"
    >
      Follow on Instagram →
    </a>

    <p class="small">Short biblical explorations — coming soon</p>
  </div>
</body>
</html>
