<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enovi - Official Site</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Orbitron Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- Your custom styles -->
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Font Awesome for social icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="container py-4">
      <!-- Logo/Title -->
      <h1 class="enovi-logo text-center">Enovi Coming soon...</h1>

      <!-- Hero Image (replace src with your own image when ready) -->
      <!-- To adjust size, edit the .hero-img class in the <style> above -->
      <img
        src="img/hairfan.jpg"
        alt="Enovi Hero"
        class="hero-img d-block mx-auto"
      />

      <!-- Social Media Links -->
      <div class="text-center mb-4 social-icons">
        <a
          href="https://www.instagram.com/enovi.world"
          title="Instagram"
          target="_blank"
          rel="noopener"
        >
          <i class="fab fa-instagram"></i>
        </a>
        <a
          href="https://www.tiktok.com/@enovi.world"
          title="TikTok"
          target="_blank"
          rel="noopener"
        >
          <i class="fab fa-tiktok"></i>
        </a>
        <a
          href="https://open.spotify.com/artist/615OlWlExXA3lTyIWX2LYg"
          title="Spotify"
          target="_blank"
          rel="noopener"
        >
          <i class="fab fa-spotify"></i>
        </a>
        <a 
          href="https://music.apple.com/us/artist/enovi/1809439539"
          title="Apple Music"
          target="_blank"
          rel="noopener"
        >
          <i class="fab fa-apple"></i>
        </a>
      </div>
   
      </div>

      <!-- About/Bio Section (add your text later) -->
      <div class="section text-center">
        <h2
          class="mb-3"
          style="font-family: 'Orbitron', sans-serif; color: #b388f9"
        >
          About
        </h2>
        <p style="font-size: 1.2rem; color: #5a3e8c">
          <!-- Add Enovi's bio here when ready -->
          Energetic 2000s-inspired pop music with a cute, dreamy vibe. Stay
          tuned for more!
        </p>
      </div>

      <!-- Upcoming Events Section (links to events page) -->
      <div class="section text-center">
        <h2
          class="mb-3"
          style="font-family: 'Orbitron', sans-serif; color: #b388f9"
        >
          upcoming events
        </h2>
        <a
          href="events.html"
          style="
            font-size: 1.3rem;
            color: #b388f9;
            text-decoration: underline;
            font-weight: bold;
          "
        >
          see me live!
        </a>
      </div>

      <!-- Contact Section (link to contact page) -->
      <div class="section text-center">
        <h2
          class="mb-3"
          style="font-family: 'Orbitron', sans-serif; color: #b388f9"
        >
          Contact
        </h2>
        <p>
          Want to book Enovi or say hi?
          <a
            href="contact.html"
            style="color: #b388f9; text-decoration: underline"
            >Contact here</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
