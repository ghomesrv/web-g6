<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enovi - Events</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Orbitron Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
        background: radial-gradient(
          circle at 60% 40%,
          #e0c3fc 0%,
          #b388f9 40%,
          #8ec5fc 80%,
          #f9f6ff 100%
        );
        margin: 0;
        font-family: "Inter", Arial, sans-serif;
      }
      .enovi-logo {
        font-family: "Orbitron", sans-serif;
        font-size: 2.5rem;
        color: #ff8ee6;
        letter-spacing: 2px;
        text-shadow: 2px 2px 12px #fff0fa, 0 0 8px #b388f9;
        margin-top: 2rem;
        margin-bottom: 1.5rem;
      }
      .section {
        background: rgba(255, 255, 255, 0.7);
        border-radius: 24px;
        padding: 2rem 1.5rem;
        margin-bottom: 2rem;
        box-shadow: 0 2px 16px rgba(180, 136, 249, 0.08);
      }
      .back-link {
        color: #b388f9;
        text-decoration: underline;
        font-size: 1.1rem;
      }
      .back-link:hover {
        color: #ff8ee6;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <!-- Logo/Title -->
      <h1 class="enovi-logo text-center">Enovi</h1>

      <div class="section">
        <h2
          class="mb-3 text-center"
          style="font-family: 'Orbitron', sans-serif; color: #b388f9"
        >
          Upcoming Events
        </h2>
        <ul class="list-unstyled" style="font-size: 1.1rem">
          <li><strong>April 29, 2025:</strong> Open Mic @ Bakersfield SoundCo  7pm</li>
         
          <!-- Add more events here as needed -->
        </ul>
        <p class="text-center" style="color: #5a3e8c">
          Check back soon for more shows and appearances!
        </p>
      </div>

      <div class="text-center">
        <a href="index.html" class="back-link">&larr; Back to Home</a>
      </div>
    </div>
  </body>
</html>
